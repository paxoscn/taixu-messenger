[package]
name = "taixu-messenger"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "微光星球：一颗可以走一圈的 3D 小星球送信游戏，后端由 taixu 驱动"
readme = "README.md"

[dependencies]
axum = "0.8"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
taixu = "0.1"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
