<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2c3a60" />
  <title>微光星球 · Tiny Messenger</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💌</text></svg>" />
  <link rel="stylesheet" href="/css/style.css" />
  <script type="importmap">
    { "imports": { "three": "/vendor/three.module.js" } }
  </script>
</head>
<body>
  <canvas id="scene" aria-label="微光星球 3D 场景"></canvas>
  <div id="grain" aria-hidden="true"></div>

  <div id="title-screen" class="title-screen">
    <div class="title-deco deco-left" aria-hidden="true">✦</div>
    <div class="title-deco deco-right" aria-hidden="true">✧</div>
    <div class="title-card">
      <div class="eyebrow">TAIXU · A TINY PLANET</div>
      <h1 class="logo">微光星球</h1>
      <div class="logo-rule"><span>✦</span></div>
      <p class="subtitle">一封慢慢送的信</p>
      <p class="blurb">在一颗三十秒就能走完的小星球上，当一名邮差。<br />把信送到每一盏灯下，顺便看看沿途的云。</p>
      <label class="name-field">
        <span>你的名字</span>
        <input id="name-input" maxlength="16" placeholder="旅人" autocomplete="off" spellcheck="false" />
      </label>
      <button id="start-button" class="btn primary" disabled>正在点亮星球…</button>
      <p id="title-error" class="title-error" role="alert"></p>
      <div class="title-hints">
        <span><b>WASD</b> 散步</span>
        <span><b>空格</b> 跳跳</span>
        <span><b>拖动</b> 环顾</span>
        <span><b>E</b> 交谈 / 收信</span>
      </div>
      <div class="title-foot">
        <span class="wax">✉</span>
        <span>邮包里装着 <b>taixu</b> 的星星</span>
      </div>
    </div>
    <div class="title-tip">小提示：这颗星球很小，迷路了也没关系。</div>
  </div>

  <div id="hud" class="hidden">
    <div class="hud-top">
      <div class="player-chip paper">
        <div class="avatar-well"><span id="avatar-hat">🧢</span></div>
        <div class="player-meta">
          <div id="player-name" class="player-name">旅人</div>
          <div class="player-sub">
            <span id="player-level">Lv.1</span>
            <span class="dot-sep">·</span>
            <span><b id="player-deliveries">0</b> 封信</span>
          </div>
        </div>
        <div class="coin-pill"><span class="coin-dot"></span><span id="player-coins">0</span></div>
      </div>

      <div class="top-right">
        <div class="online-pill"><span class="online-dot"></span><span id="online-count">1</span> 位旅人</div>
        <div class="icon-row">
          <button class="icon-btn" data-panel="tasks" title="任务板" aria-label="任务板">📮</button>
          <button class="icon-btn" data-panel="collection" title="集邮册 / 成就" aria-label="集邮册">📖</button>
          <button class="icon-btn" data-panel="shop" title="帽子铺" aria-label="帽子铺">🎩</button>
          <button class="icon-btn" data-panel="leaderboard" title="邮差榜" aria-label="邮差榜">🏆</button>
          <button class="icon-btn" data-panel="news" title="公告" aria-label="公告">📣<i class="badge hidden" id="news-badge"></i></button>
          <button class="icon-btn sound-btn" id="sound-toggle" title="声音开关" aria-label="声音开关">🔔</button>
        </div>
      </div>
    </div>

    <div id="letter-tracker" class="tracker paper hidden">
      <div class="tracker-envelope">✉️</div>
      <div class="tracker-body">
        <div class="tracker-eyebrow">正在投递</div>
        <div id="tracker-target" class="tracker-target">写给阿达的信</div>
        <div id="tracker-place" class="tracker-place">潮汐灯塔</div>
      </div>
      <div class="compass" aria-hidden="true">
        <div class="compass-ring"></div>
        <div id="compass-arrow" class="compass-arrow">➤</div>
      </div>
    </div>

    <div id="interact-prompt" class="prompt hidden">
      <span class="keycap">E</span>
      <span id="prompt-text">交谈</span>
    </div>

    <div id="emote-bar" class="emote-bar" aria-label="表情">
      <button data-emote="wave" title="挥手 (1)"><span>👋</span><em>1</em></button>
      <button data-emote="heart" title="比心 (2)"><span>❤️</span><em>2</em></button>
      <button data-emote="laugh" title="大笑 (3)"><span>😄</span><em>3</em></button>
      <button data-emote="note" title="哼歌 (4)"><span>🎵</span><em>4</em></button>
      <button data-emote="mail" title="来信 (5)"><span>✉️</span><em>5</em></button>
      <button data-emote="star" title="许愿 (6)"><span>✨</span><em>6</em></button>
    </div>

    <div id="controls-hint" class="controls-hint">
      <span><b>WASD</b> 散步</span><span><b>Shift</b> 小跑</span><span><b>空格</b> 跳</span><span><b>E</b> 互动</span>
    </div>

    <div id="toasts" class="toasts" aria-live="polite"></div>

    <div id="dialog" class="dialog paper hidden" role="dialog" aria-modal="false">
      <button id="dialog-close" class="dialog-close" aria-label="关闭">✕</button>
      <div class="dialog-head">
        <div id="dialog-avatar" class="dialog-avatar">🧑‍🌾</div>
        <div>
          <div id="dialog-name" class="dialog-name">居民</div>
          <div id="dialog-title" class="dialog-title">小星球居民</div>
        </div>
      </div>
      <p id="dialog-line" class="dialog-line"></p>
      <div id="dialog-actions" class="dialog-actions"></div>
    </div>

    <div id="panel-backdrop" class="panel-backdrop hidden"></div>
    <aside id="panel" class="panel paper hidden" role="dialog" aria-modal="true" aria-labelledby="panel-title">
      <header class="panel-head">
        <div>
          <div class="panel-eyebrow">POST OFFICE</div>
          <h2 id="panel-title">任务板</h2>
        </div>
        <button id="panel-close" class="panel-close" aria-label="关闭">✕</button>
      </header>
      <nav class="panel-tabs" id="panel-tabs">
        <button data-tab="tasks">任务</button>
        <button data-tab="collection">集邮</button>
        <button data-tab="shop">帽子</button>
        <button data-tab="leaderboard">榜单</button>
        <button data-tab="news">公告</button>
      </nav>
      <div id="panel-body" class="panel-body"></div>
    </aside>

    <div id="joystick" class="joystick hidden" aria-hidden="true">
      <div class="joystick-knob"></div>
    </div>
    <button id="jump-btn" class="jump-btn hidden" aria-label="跳跃">跳</button>
    <button id="interact-btn" class="interact-btn hidden" aria-label="互动">E</button>

    <div id="fade" class="fade"></div>
  </div>

  <div id="boot" class="boot">
    <div class="boot-envelope">✉️</div>
    <div class="boot-text">正在点亮星球…</div>
  </div>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
